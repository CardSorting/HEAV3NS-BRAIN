name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all -- -D warnings

      - name: Build (CPU mock, no CUDA)
        run: cargo build --release

      - name: Run all tests
        run: cargo test --all

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Build docs
        run: cargo doc --all --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python-modal:
    name: Python Modal & Scripts Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx ruff

      - name: Lint Python (ruff)
        run: ruff check deploy/modal scripts

      - name: Run Modal lifecycle, policy, and gateway tests
        run: python -W ignore -m unittest discover -s deploy/modal -p "test_*.py" -v

      - name: Run scripts unit tests
        run: python -W ignore -m unittest discover -s scripts -p "test_*.py" -v


